[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "delete-citations"
version = "0.2.0"
description = "Outil CLI et bibliothèque Python pour la détection, la suppression et le remplacement récursif des citations [cite ...] dans les fichiers et arborescences de dossiers (.tex, .org, .md, etc.)."
readme = "README.md"
authors = [{ name = "newe" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
keywords = [
    "citation",
    "cleanup",
    "regex",
    "latex",
    "org-mode",
    "markdown",
    "academic-writing",
    "cli",
    "recursive",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Filters",
    "Topic :: Utilities",
]

[project.scripts]
delete-citations = "delete_citations.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.coverage.run]
source = ["delete_citations"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
