[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "delete-citations"
version = "0.1.0"
description = "Outil de suppression des citations [cite ...] dans les fichiers .tex, .org, .odt, etc."
authors = [{ name = "newe" }]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
delete-citations = "delete_citations.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.coverage.run]
source = ["delete_citations"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
